<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Usuários</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Gerenciador de Usuários</h2>

        <!-- Formulário de Cadastro -->
        <div class="card p-4 mb-5 shadow-sm">
            <form action="/adicionar" method="POST" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="nome" class="form-control" required placeholder="Digite o nome">
                </div>
                <div class="col-md-5">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" required placeholder="Digite o e-mail">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Salvar</button>
                </div>
            </form>
        </div>

        <!-- Tabela de Usuários cadastrados -->
        <div class="card p-4 shadow-sm">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in usuarios %}
                    <tr>
                        <td>{{ u.id }}</td>
                        <td>{{ u.nome }}</td>
                        <td>{{ u.email }}</td>
                        <td>
                            <!-- Botão Editar (Abre o Modal) -->
                            <button type="button" class="btn btn-primary btn-sm me-2" data-bs-toggle="modal" data-bs-target="#editModal{{ u.id }}">
                                Editar
                            </button>

                            <!-- Formulário de Exclusão -->
                            <form action="/deletar/{{ u.id }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>

                    <!-- Janela Flutuante (Modal) de Edição exclusiva para este usuário -->
                    <div class="modal fade" id="editModal{{ u.id }}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Editar Usuário</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <form action="/atualizar/{{ u.id }}" method="POST">
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label class="form-label">Nome Completo</label>
                                            <input type="text" name="nome" class="form-control" value="{{ u.nome }}" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">E-mail</label>
                                            <input type="email" name="email" class="form-control" value="{{ u.email }}" required>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">Nenhum usuário cadastrado ainda.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- JS do Bootstrap (Necessário para a janela flutuante abrir e fechar) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
